[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentstudio"
version = "0.1.0"
description = "A thin control plane for meshing agents across frameworks (LangGraph, CrewAI, and beyond) over an A2A-inspired HTTP surface -- no framework rewrites required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gowtham" }]
keywords = ["agents", "multi-agent", "langgraph", "crewai", "a2a", "mcp", "orchestration", "agentic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.0",
  "click>=8.1",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.60"]
dev = ["pytest>=8.0"]

[project.scripts]
agentstudio = "agentstudio.cli:main"

# TODO: replace REPLACE_ME with your GitHub username before pushing
[project.urls]
Homepage = "https://github.com/REPLACE_ME/agentstudio"
Repository = "https://github.com/REPLACE_ME/agentstudio"
Issues = "https://github.com/REPLACE_ME/agentstudio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentstudio"]
